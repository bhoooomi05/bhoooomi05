<svg width="1100" height="560" viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Developer card: Bhoomi Koli builds responsive interfaces, full-stack APIs, and AI/ML experiments" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="20%" cy="10%" r="90%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="glowDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="1096" height="556" rx="20" fill="url(#bg)"/>
  <rect x="2" y="2" width="1096" height="556" rx="20" fill="none" stroke="url(#border)" stroke-width="1.4"/>

  <!-- terminal chrome -->
  <circle cx="40" cy="38" r="5" fill="#EF4444"/>
  <circle cx="58" cy="38" r="5" fill="#F59E0B"/>
  <circle cx="76" cy="38" r="5" fill="#10B981"/>
  <rect x="430" y="26" width="240" height="24" rx="6" fill="#0F172A" stroke="#94A3B8" stroke-opacity="0.25"/>
  <text x="550" y="42" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11" fill="#94A3B8">bhoomi.dev/build</text>

  <text x="40" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12" letter-spacing="2.5" fill="#22D3EE">// DEVELOPER</text>
  <text x="40" y="128" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="28" font-weight="700" fill="#F8FAFC">Interfaces built with intent</text>

  <!-- illustration panel -->
  <rect x="40" y="156" width="1020" height="230" rx="14" fill="#0F172A" fill-opacity="0.5" stroke="#94A3B8" stroke-opacity="0.15"/>

  <!-- desk line -->
  <line x1="300" y1="340" x2="800" y2="340" stroke="#94A3B8" stroke-opacity="0.35" stroke-width="2"/>

  <!-- laptop -->
  <g>
    <rect x="430" y="255" width="220" height="130" rx="8" fill="#111827" stroke="#22D3EE" stroke-opacity="0.5"/>
    <rect x="442" y="266" width="196" height="92" rx="3" fill="url(#screenGlow)"/>
    <rect x="455" y="278" width="80" height="6" rx="3" fill="#F8FAFC" opacity="0.5"/>
    <rect x="455" y="292" width="140" height="6" rx="3" fill="#F8FAFC" opacity="0.35"/>
    <rect x="455" y="306" width="110" height="6" rx="3" fill="#F8FAFC" opacity="0.35"/>
    <rect x="455" y="320" width="150" height="6" rx="3" fill="#10B981" opacity="0.6"/>
    <path d="M420 385 L660 385 L645 400 L435 400 Z" fill="#1E293B" stroke="#94A3B8" stroke-opacity="0.3"/>
  </g>

  <!-- figure (abstract, geometric, original) -->
  <g>
    <circle cx="360" cy="230" r="26" fill="#7C3AED" opacity="0.9"/>
    <path d="M330 340 Q330 270 360 262 Q390 270 390 340 Z" fill="#22D3EE" opacity="0.85"/>
    <rect x="345" y="300" width="70" height="14" rx="7" fill="#10B981" opacity="0.7"/>
  </g>

  <!-- floating accent dots -->
  <circle cx="900" cy="200" r="3" fill="url(#glowDot)">
    <animate attributeName="cy" values="200;180;200" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="930" cy="330" r="2.4" fill="url(#glowDot)">
    <animate attributeName="cy" values="330;310;330" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="190" r="2.4" fill="url(#glowDot)">
    <animate attributeName="cy" values="190;170;190" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- feature rows -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
    <rect x="40" y="410" width="20" height="20" rx="5" fill="#7C3AED" opacity="0.25"/>
    <text x="50" y="424" text-anchor="middle" font-size="12" fill="#22D3EE">&lt;/&gt;</text>
    <text x="72" y="420" font-size="15" font-weight="700" fill="#F8FAFC">Responsive, practical UI</text>
    <text x="72" y="438" font-size="12" fill="#94A3B8">HTML, CSS, JavaScript &amp; React</text>

    <rect x="400" y="410" width="20" height="20" rx="5" fill="#22D3EE" opacity="0.25"/>
    <text x="410" y="424" text-anchor="middle" font-size="11" fill="#22D3EE">API</text>
    <text x="432" y="420" font-size="15" font-weight="700" fill="#F8FAFC">Full-stack &amp; API development</text>
    <text x="432" y="438" font-size="12" fill="#94A3B8">Node.js, Flask &amp; FastAPI</text>

    <rect x="760" y="410" width="20" height="20" rx="5" fill="#10B981" opacity="0.25"/>
    <text x="770" y="424" text-anchor="middle" font-size="11" fill="#10B981">AI</text>
    <text x="792" y="420" font-size="15" font-weight="700" fill="#F8FAFC">AI/ML experiments</text>
    <text x="792" y="438" font-size="12" fill="#94A3B8">Python &amp; classical ML models</text>
  </g>

  <text x="40" y="500" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12" fill="#22D3EE">~/bhoomi $ status --current</text>
  <text x="40" y="520" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12" fill="#F8FAFC">Learning Data Science &amp; Cybersecurity<tspan fill="#22D3EE"> &#9608;<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
</svg>